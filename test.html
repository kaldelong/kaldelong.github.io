    body {
      margin: 0;
    }
    .container {
      display: flex;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: red;
    }
  
    .sidebar {
      position: sticky;
      top: 20px; /* sticks 20px from the viewport top */
      align-self: start; /* important for flex children */
      background: lightblue;
      padding: 10px;
      width: 200px;
      height: 300px; /* sidebar content height */
    }
  
    .content {
      flex-grow: 1;
      padding-left: 20px;
    }
  
    .content > p {
      margin-bottom: 2000px; /* just to create scroll */
    }
  </style>
  
  <div class="container">
    <div class="sidebar">
      I’m sticky and will stop at the container bottom!
    </div>

    </div>
  </div>
